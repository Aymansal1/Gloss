name: Build

on:
  push:
    branches: [main, wip]
    paths-ignore: ['**.md', 'docs/**', 'licenses/**', 'site/**', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      # One-time bootstrap: the project was scaffolded without network access to
      # services.gradle.org, so the first CI run generates the wrapper and commits it.
      - name: Add Gradle wrapper if missing
        if: github.event_name == 'push' && hashFiles('gradlew') == ''
        run: |
          gradle wrapper --gradle-version 8.14.3 --distribution-type bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "build: add Gradle wrapper (8.14.3)"
          git push

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest 2>&1 | tee build.log

      - name: Summarise tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(path).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              # Each failure as its own annotation, so it shows on the run's summary page.
              for case in r.iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      msg = (bad.get("message") or bad.text or "").strip().splitlines()[0][:400]
                      print(f"::error title={case.get('classname', '').split('.')[-1]}.{case.get('name')}::{msg}")
          level = "error" if (f or e or t == 0) else "notice"
          print(f"::{level} title=Unit tests::{t} run, {f} failed, {e} errors, {s} skipped")
          PY

      # Screenshot tests write PNGs of the real screens. Each push publishes them to the
      # `screenshots` branch (one commit, replaced each time) so they can be looked at
      # without downloading artifacts.
      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src="$GITHUB_WORKSPACE/app/build/outputs/roborazzi"
          ls "$src"/*.png >/dev/null 2>&1 || { echo "No screenshots"; exit 0; }
          dir="$RUNNER_TEMP/shots" && rm -rf "$dir" && mkdir -p "$dir/${GITHUB_REF_NAME}"
          cp "$src"/*.png "$dir/${GITHUB_REF_NAME}/"
          cd "$dir"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the other branch's folder from the last publish.
          if git fetch -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots 2>/dev/null; then
            for d in $(git ls-tree --name-only FETCH_HEAD); do
              [ "$d" != "$GITHUB_REF_NAME" ] && git checkout FETCH_HEAD -- "$d" 2>/dev/null || true
            done
          fi
          git add -A
          git commit -qm "Screenshots from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      # Signing key comes from repository secrets; forks and PRs build with the debug key.
      - name: Restore signing key
        env:
          GLOSS_KEYSTORE_BASE64: ${{ secrets.GLOSS_KEYSTORE_BASE64 }}
        if: env.GLOSS_KEYSTORE_BASE64 != ''
        run: |
          echo "$GLOSS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gloss.jks"
          echo "GLOSS_KEYSTORE=$RUNNER_TEMP/gloss.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GLOSS_KEYSTORE_PASSWORD: ${{ secrets.GLOSS_KEYSTORE_PASSWORD }}
          GLOSS_KEY_ALIAS: ${{ secrets.GLOSS_KEY_ALIAS }}
          GLOSS_KEY_PASSWORD: ${{ secrets.GLOSS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease 2>&1 | tee -a build.log

      # Compiler errors, gathered at the end of the log where they're easy to find.
      - name: Compile errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | sed 's#file:///home/runner/work/Gloss/Gloss/##' || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Gloss-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: Gloss-apk
          path: out/*.apk
          retention-days: 30

      # Each main build becomes a real release so the in-app update check
      # (GitHub releases/latest) can offer it. Only signed builds are published.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.GLOSS_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub sometimes refuses the first try with a 403, so give it a few.
        run: |
          for wait in 0 20 60 120; do
            sleep "$wait"
            gh release create "v1.0.${GITHUB_RUN_NUMBER}" out/*.apk \
              --title "Gloss 1.0.${GITHUB_RUN_NUMBER}" \
              --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
              --target "$GITHUB_SHA" && exit 0
            gh release delete "v1.0.${GITHUB_RUN_NUMBER}" --yes --cleanup-tag 2>/dev/null || true
          done
          exit 1
